name: update-results
on:
  schedule:
    - cron: '*/10 0-15 7,8 11 *'   # every 10 min, 07:00–22:59 Bangkok, 7–8 Nov
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update-results
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pymupdf
      - name: Fetch result PDFs
        run: python scripts/fetch_results.py
      - name: Parse results
        run: python scripts/parse_results.py
      - name: Build site
        run: python scripts/build.py
      - name: Commit data
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add raw data
          git diff --cached --quiet || (git commit -m "results: auto update $(TZ=Asia/Bangkok date '+%d/%m %H:%M')" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: '${{ steps.d.outputs.page_url }}'}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
