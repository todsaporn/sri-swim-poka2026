<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b4f8a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ศรีอรุโณทัย">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ศรีอรุโณทัย · Krabi PAO Swimming #16 · Day 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--disp:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;--bg:#f3f7fa;--card:#fff;--ink:#0d2236;--mut:#5d7084;--line:#e1e8ef;--pri:#0b4f8a;--pri2:#0e7ac4;--aqua:#14b8c4;--m:#1f6fd1;--f:#d6458a;--warn:#c2410c;--warnbg:#fff3e8;--gold:#b7860b;--r:16px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Prompt','IBM Plex Sans Thai',sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,#18a6c9 0%,#0b4f8a 45%,#082d50 100%);color:#fff;padding:26px 0 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -10% -40px -10%;height:90px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 18%);transform:skewY(-3deg)}
.kick{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero h1{font-size:30px;line-height:1.15;margin-top:6px}
.hero .sub{opacity:.9;margin-top:4px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px)}
.stat b{display:block;font-family:var(--disp);font-size:clamp(18px,5.4vw,24px);line-height:1.1;white-space:nowrap}
.stat span{font-size:12px;opacity:.85}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:25px}}
/* next */
.next{margin-top:-14px;position:relative;z-index:2}
.nextcard{background:var(--card);border-radius:var(--r);box-shadow:0 6px 24px rgba(8,45,80,.12);padding:14px 16px}
.nexthead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.nexthead h3{font-size:15px}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:#e6f6f8;color:#08707a;font-weight:600;white-space:nowrap}
.nextrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.nextrow::-webkit-scrollbar{display:none}
.mini{flex:0 0 auto;min-width:168px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fbfdfe;text-align:left}
.mini .tm{font-family:var(--disp);font-weight:600;font-size:17px;color:var(--pri)}
.mini .nm{font-weight:600;font-size:14px;white-space:nowrap}
.mini .ev{font-size:12px;color:var(--mut);white-space:nowrap}
/* controls */
.bar{position:sticky;top:0;z-index:20;background:rgba(243,247,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0 8px;margin-top:14px}
.tabs{display:flex;gap:4px;background:#e3ebf2;padding:4px;border-radius:12px}
.tab{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap}
.tab.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.filters{display:flex;gap:8px;align-items:center;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.search{flex:0 0 190px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font:inherit;font-size:14px;outline:none}
.search:focus{border-color:var(--pri2)}
.seg{display:flex;flex:0 0 auto;gap:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.m.on{background:var(--m);border-color:var(--m)}.chip.f.on{background:var(--f);border-color:var(--f)}
.sep{width:1px;height:22px;background:var(--line);flex:0 0 auto}
.reset{border:0;background:none;color:var(--pri2);font-size:13px;font-weight:600;white-space:nowrap}
.count{font-size:13px;color:var(--mut);margin:14px 0 8px}
/* schedule */
.hour{margin:18px 0 8px;display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;color:var(--pri)}
.hour:after{content:"";flex:1;height:1px;background:var(--line)}
.race{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;width:100%;text-align:left;transition:transform .12s,box-shadow .12s}
.race:hover{box-shadow:0 4px 14px rgba(8,45,80,.08);transform:translateY(-1px)}
.race.past{opacity:.55}
.race.now{border-color:var(--aqua);box-shadow:0 0 0 2px rgba(20,184,196,.25)}
.race .tm{font-family:var(--disp);font-weight:600;font-size:18px;color:var(--pri);line-height:1.1}
.race .tm small{display:block;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:11px;color:var(--mut);font-weight:500}
.race .who{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.race .what{font-size:13px;color:var(--mut)}
.gdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.gdot.M{background:var(--m)}.gdot.F{background:var(--f)}
.lane{text-align:center;min-width:54px}
.lane b{display:block;font-family:var(--disp);font-size:20px;line-height:1}
.lane span{font-size:11px;color:var(--mut)}
.seedtag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:#eef3f8;color:var(--mut)}
.seedtag.top{background:#fff6dc;color:var(--gold)}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.rel{background:#e9f0ff;color:#3546b5}
/* athletes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ath{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%;position:relative;transition:box-shadow .12s}
.ath:hover{box-shadow:0 4px 14px rgba(8,45,80,.08)}
.ath .top{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--disp);font-weight:600;color:#fff;flex:0 0 auto;font-size:17px}
.av.M{background:linear-gradient(135deg,#3a8ee6,#1f5fb8)}.av.F{background:linear-gradient(135deg,#ec6aa6,#b93374)}
.ath .nm{font-weight:700;font-size:15.5px;line-height:1.25}
.ath .meta{font-size:12.5px;color:var(--mut)}
.strk{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.sk{font-size:11.5px;padding:2px 8px;border-radius:7px;background:#eef6fb;color:#0b5f8e;font-weight:500}
.span{font-size:12.5px;color:var(--mut);margin-top:8px;display:flex;justify-content:space-between;gap:6px}
.star{position:absolute;top:10px;right:10px;border:0;background:none;font-size:19px;line-height:1;color:#c9d3dc;padding:4px}
.star.on{color:#f2b100}
/* ages */
.agegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.agebox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.agebox h3{font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.agebox h3 small{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:12.5px;color:var(--mut);font-weight:500}
.sexrow{margin-top:10px}
.sexrow .lbl{font-size:12px;font-weight:700;letter-spacing:.03em;margin-bottom:5px}
.sexrow .lbl.M{color:var(--m)}.sexrow .lbl.F{color:var(--f)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;width:100%;border:0;background:#f6f9fb;margin-bottom:4px;text-align:left;font-size:14px}
.ln:hover{background:#eaf2f8}
.dots{display:flex;gap:3px}
.dots i{min-width:22px;padding:0 4px;height:18px;border-radius:5px;font-style:normal;font-size:10.5px;display:grid;place-items:center;background:#e3ebf2;color:#8698aa;font-weight:600}
.dots i.y{background:var(--pri2);color:#fff}
.legend{font-size:12px;color:var(--mut);margin:4px 0 12px}
/* relay */
.relay{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.relay .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
/* lineup */
.lu{width:100%;border-collapse:collapse;font-size:14px}
.lu td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.lu td:first-child{width:34px;font-family:var(--disp);font-weight:600;text-align:center;color:var(--mut)}
.lu td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lu tr.me td{background:#e8f7f9}
.lu tr.me td:first-child{color:var(--pri);border-left:3px solid var(--aqua)}
.lu .tmn{font-size:12px;color:var(--mut)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(6,25,45,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 28px;animation:up .2s ease-out}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .x{float:right;border:0;background:#eef2f6;border-radius:50%;width:32px;height:32px;font-size:18px}
.sheet h2{font-size:21px;margin-bottom:2px}
.tl{margin-top:14px;border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .it{position:relative;margin-bottom:12px}
.tl .it:before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri2);border:2px solid #fff;box-shadow:0 0 0 1px var(--pri2)}
.tl .gap{font-size:12px;color:var(--mut);margin:-4px 0 8px}
.tl .gap.warn{color:var(--warn);font-weight:600}
.tl button{border:1px solid var(--line);background:#fbfdfe;border-radius:12px;padding:9px 12px;width:100%;text-align:left}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.foot{font-size:12px;color:var(--mut);text-align:center;padding:30px 16px 40px}
.hidden{display:none!important}
.pdf{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;text-decoration:none;color:#c0262d;font-size:11px;font-weight:700;border:1px solid #f3c9cb;background:#fff5f5;border-radius:6px;padding:1px 5px 1px 3px;line-height:1.4;cursor:pointer}
.pdf svg{width:13px;height:13px;flex:0 0 auto}
.pdf:active{transform:scale(.95)}
.rec{display:flex;align-items:center;gap:8px;background:#fff8e6;border:1px solid #f6e3a8;border-radius:12px;padding:8px 12px;font-size:13.5px;margin:0 0 10px}
.rec b{font-variant-numeric:tabular-nums}
.rec.new{background:#fff0ec;border-color:#f8c4b4}
.rec small{color:var(--mut)}
.nrb{display:inline-block;background:#ff5a1f;color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 5px;letter-spacing:.03em;vertical-align:middle}
html,body{overscroll-behavior-y:contain}
.ptr{position:fixed;left:50%;top:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,-90px);pointer-events:none;transition:transform .25s cubic-bezier(.2,.9,.3,1.2)}
.ptr.drag{transition:none}
.ptr-ring{--p:0;width:52px;height:52px;border-radius:50%;padding:4px;background:conic-gradient(#14b8c4 calc(var(--p)*1turn),rgba(255,255,255,.35) 0);box-shadow:0 6px 20px rgba(8,45,80,.3)}
.ptr-ring img{width:100%;height:100%;border-radius:50%;background:#fff;display:block;transform:rotate(calc(var(--p)*360deg))}
.ptr.spin .ptr-ring{background:conic-gradient(#14b8c4 0 .3turn,rgba(255,255,255,.35) 0);animation:ptrspin .8s linear infinite}
.ptr.spin .ptr-ring img{animation:ptrbob 1.6s ease-in-out infinite reverse}
.ptr.ok .ptr-ring{background:#22c55e}
.ptr-txt{font-size:12px;font-weight:600;color:#fff;background:#0b4f8a;padding:3px 10px;border-radius:99px;white-space:nowrap;opacity:0;transition:opacity .15s}
.ptr.show .ptr-txt{opacity:1}
@keyframes ptrspin{to{transform:rotate(1turn)}}
@keyframes ptrbob{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(-20deg) scale(.92)}}
body.pulling .hero,body.pulling .next,body.pulling #medals{transition:none}
.hero,.next,#medals{transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.brand{display:flex;align-items:center;gap:12px;margin-top:6px}.brand h1{margin-top:0}
.logo{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);flex:0 0 auto}
@media(max-width:560px){.logo{width:46px;height:46px}}
.install{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;border:0;border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,#ffd23f,#ffb703);color:#08263f;text-align:left;box-shadow:0 8px 24px rgba(255,183,3,.35);animation:cheer 2.2s ease-in-out infinite;position:relative;z-index:1}
.install .ib{font-size:28px;line-height:1}.install .ib img{width:40px;height:40px;border-radius:10px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.install b{display:block;font-family:var(--disp);font-size:16.5px;line-height:1.2}
.install small{display:block;font-size:12.5px;opacity:.8;margin-top:1px}
.install .go{margin-left:auto;background:#08263f;color:#ffd23f;font-weight:700;border-radius:99px;padding:7px 13px;font-size:13.5px;white-space:nowrap}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-2px) scale(1.015)}55%{transform:translateY(0) scale(1)}}
.howto{counter-reset:s;margin:12px 0 4px;padding:0;list-style:none}
.howto li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.howto li:before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:0 6px;background:#f6f9fb;font-weight:600}
.fetched{position:absolute;top:-12px;right:16px;font-size:11.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:3px 9px;display:flex;align-items:center;gap:6px;white-space:nowrap;z-index:2}
.fetched:before{content:"";width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.fetched.stale:before{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
@media(max-width:560px){.fetched{position:static;display:inline-flex;font-size:11px;margin:-8px 0 10px;float:right}.hero .kick{clear:both}}
#medals{margin-top:14px}
.mcard{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px 16px;box-shadow:0 2px 10px rgba(8,45,80,.05)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mhead h3{font-size:17px}
.mtot{display:flex;gap:6px}
.mtot span{display:flex;align-items:center;gap:4px;font-family:var(--disp);font-weight:700;font-size:18px;padding:3px 10px;border-radius:10px}
.mtot .g{background:#fff6d6;color:#8a6300}.mtot .s{background:#eef1f4;color:#4b5866}.mtot .b{background:#fbeee4;color:#8a4a1c}
.mlist{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 18px}
.mrow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:14.5px;width:100%}
.mrow .rk{font-family:var(--disp);font-weight:700;color:var(--mut);text-align:center}
.mrow .nm small{color:var(--mut);font-size:12px;margin-left:4px}
.mrow .md{display:flex;gap:7px;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
.mrow .md i{font-style:normal}
.mmore{margin-top:8px;border:0;background:none;color:var(--pri2);font-weight:600;font-size:13.5px;padding:4px 0}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 10px}
.dayhd{margin:22px 0 4px;font-family:var(--disp);font-size:19px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.dayhd span{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:12px;font-weight:600;background:#e3ebf2;color:var(--mut);border-radius:99px;padding:2px 9px}
.res{text-align:center;min-width:64px}
.res .pl{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.05}
.res .pl.p1{color:#b7860b}.res .pl.p2{color:#6b7a89}.res .pl.p3{color:#a0592b}
.res .ft{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.res .dl{font-size:11px;font-weight:600}
.up{color:#0f8a4b}.dn{color:#b4462b}
.res.dq .pl{color:#c0262d;font-size:16px}
.medal{font-size:18px;line-height:1}
.rbox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.rbox div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.rbox b{display:block;font-family:var(--disp);font-size:24px;line-height:1.1}
.rbox span{font-size:12px;color:var(--mut)}
.board{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;margin-bottom:14px}
.board h3{font-size:15px;margin:8px 0 4px}
.brow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:14px}
.brow:first-of-type{border-top:0}
.brow .md{display:flex;gap:8px;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.pending{font-size:11.5px;color:var(--mut);font-weight:600}
.why{font-size:12px;color:#c0262d;margin-top:2px}
.top3{margin:10px 0 14px;background:#f6f9fb;border-radius:12px;padding:8px 12px;font-size:13.5px}
.top3 div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.top3 .me{font-weight:700;color:var(--pri)}
.upd{display:inline-flex;align-items:center;gap:6px}
.upd:before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.pick{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.pick.on{background:#e6f6f8;border-color:var(--aqua);color:#08707a}
.pk-x{font-size:12px;font-weight:500;opacity:.75;margin-left:4px}
.pk-sec{margin-top:14px}.pk-sec .lbl{font-size:13px;font-weight:700;margin-bottom:6px}.pk-sec .lbl.M{color:var(--m)}.pk-sec .lbl.F{color:var(--f)}
.pk-age{margin-bottom:10px}
.pk-ah{border:0;background:none;font-family:var(--disp);font-weight:600;font-size:15px;padding:2px 0;margin-bottom:4px}
.pk-ah small{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-weight:500;font-size:12px;color:var(--pri2);margin-left:6px}
.pk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.pk-it{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fbfdfe;border-radius:11px;padding:8px 10px;font-size:14.5px;font-weight:600}
.pk-it small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.pk-it .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid #b9c7d4;display:grid;place-items:center;font-size:13px;flex:0 0 auto;color:#fff}
.pk-it.on{border-color:var(--aqua);background:#e8f7f9}.pk-it.on .ck{background:var(--aqua);border-color:var(--aqua)}
.pk-foot{position:sticky;bottom:-28px;background:#fff;display:flex;gap:8px;padding:12px 0 4px;margin-top:8px;border-top:1px solid var(--line)}
.pk-b1{flex:1;border:0;background:var(--pri);color:#fff;border-radius:12px;padding:11px;font-weight:700}
.pk-b2{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 18px;font-weight:600}
.pastbtn{width:100%;border:1px dashed #b9c7d4;background:#fff;border-radius:12px;padding:10px;font-weight:600;font-size:14px;color:var(--pri);margin:4px 0 6px}
.pastbtn span{background:#eef3f8;color:var(--mut);border-radius:99px;padding:1px 8px;font-size:12px;margin-left:4px}
</style>
</head>
<body>
<div class="ptr" id="ptr"><div class="ptr-ring" id="ptrRing"><img src="logo.png" alt=""></div><div class="ptr-txt" id="ptrTxt">ดึงลงเพื่อรีโหลด</div></div>
<header class="hero"><div class="wrap" style="position:relative">
  <div class="fetched" id="fetched"></div>
  <div class="kick" id="meetname"></div>
  <div class="brand"><img src="logo.png" alt="SSC" class="logo"><h1>ทีมว่ายน้ำ ศรีอรุโณทัย</h1></div>
  <div class="sub" id="meetday"></div>
  <button class="install hidden" id="install"><span class="ib"><img src="apple-touch-icon.png" alt=""></span><span><b>ติดตั้งแอปเชียร์ ศรีอรุโณทัย</b><small>กดครั้งเดียว · เปิดจากหน้าจอมือถือได้เลย ผลอัปเดตสด</small></span><span class="go">ติดตั้ง ›</span></button>
  <div class="stats" id="stats"></div>
</div></header>

<section class="wrap next"><div class="nextcard">
  <div class="nexthead"><h3 id="nexttitle">รายการถัดไป</h3><span class="pill" id="clock"></span></div>
  <div class="nextrow" id="nextrow"></div>
</div></section>

<section class="wrap" id="medals"></section>
<div class="bar"><div class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab" data-v="schedule">ตารางแข่ง</button>
    <button class="tab" data-v="results">ผลแข่ง</button>
    <button class="tab" data-v="athletes">นักกีฬา</button>
    <button class="tab" data-v="ages">รุ่นอายุ</button>
    <button class="tab" data-v="relays">ผลัด</button>
  </div>
  <div class="filters" id="filters">
    <div class="seg" id="fd"></div><span class="sep" id="fdsep"></span>
    <button class="pick" id="pick"></button>
    <div class="seg" id="fg"></div><span class="sep"></span>
    <div class="seg" id="fa"></div><span class="sep"></span>
    <div class="seg" id="fs"></div>
    <button class="reset" id="reset">ล้างตัวกรอง</button>
  </div>
</div></div>

<main class="wrap">
  <div class="count" id="count"></div>
  <section id="v-schedule"></section>
  <section id="v-results"></section>
  <section id="v-athletes"></section>
  <section id="v-ages"></section>
  <section id="v-relays"></section>
</main>
<div class="foot wrap" id="foot"></div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const DATA=__DATA__;
const EV=DATA.events, R=DATA.races, H=DATA.heats;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const G={M:'ชาย',F:'หญิง'};
const ST=['ฟรีสไตล์','กรรเชียง','กบ','ผีเสื้อ','เดี่ยวผสม'];
const evLabel=e=>`${e.dist}ม. ${e.stroke}`;
const ageLabel=e=>/ปี/.test(e.age)?`${e.age}`:`${e.age} ปี`;
// enrich
const CL=DATA.clubs||null;
const DAYS=DATA.days, EVR=DATA.evres||{}, ST_=DATA.stand||{};
const nrm=s=>String(s).replace(/[\s.]/g,'');
R.forEach(r=>{r.e=EV[r.ev];r.g=r.e.g;r.day=r.day||1;r.m=(r.day-1)*1440+mins(r.t)});
const dayList=[...new Set(R.map(r=>r.day))].sort();
const dLabel=d=>(DAYS[d]||{}).label||('Day '+d);
R.sort((a,b)=>a.m-b.m||a.ev-b.ev);
const ind=R.filter(r=>!r.relay), rel=R.filter(r=>r.relay);
const A={};
ind.forEach(r=>{(A[r.name]??={name:r.name,age:r.age,g:r.g,races:[]}).races.push(r)});
const ath=Object.values(A).sort((a,b)=>a.age-b.age||a.g.localeCompare(b.g)||a.name.localeCompare(b.name,'th'));
ath.forEach(a=>{a.races.sort((x,y)=>x.m-y.m);a.minGap=Infinity;for(let i=1;i<a.races.length;i++){if(a.races[i].day!==a.races[i-1].day)continue;const g=a.races[i].m-a.races[i-1].m;a.races[i].gap=g;a.minGap=Math.min(a.minGap,g)}
  a.med=[0,0,0];a.races.forEach(r=>{const x=r.res;if(x&&x.lv!=null)a.med[x.lv]++});
  const ie=a.races[0].e;a.cat=a.g+'|'+ie.age;a.catL=`${G[a.g]} ${ageLabel(ie)}`;const sc=ST_[a.cat];a.st=sc&&sc.our[nrm(a.name)]||{p:0,rk:null};a.nres=a.races.filter(r=>r.res).length});
const TIGHT=15;const dur=m=>m<60?m+' นาที':Math.floor(m/60)+' ชม.'+(m%60?' '+m%60+' นาที':'');
// state
const S={d:'',sel:new Set(),showPast:false,v:'schedule',g:'',a:'',s:'',fav:false};
let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('sri-favs')||'[]'))}catch(e){}
const saveFav=()=>{try{localStorage.setItem('sri-favs',JSON.stringify([...favs]))}catch(e){}};
// header
const MED=['🥇','🥈','🥉'];
const allMed=[0,0,0];let allPts=0;R.forEach(r=>{const x=r.res;if(!x)return;if(x.lv!=null)allMed[x.lv]++;if(!r.relay)allPts+=x.pts||0});const nRes=R.filter(r=>r.res).length;
function medStat(){return nRes?[`🥇${allMed[0]} 🥈${allMed[1]} 🥉${allMed[2]}`,`เหรียญรวม (ผลออก ${nRes}/${R.length})`]:[dayList.length,'วันแข่งขัน']}
$('#meetname').textContent=DATA.meet.name;
$('#meetday').textContent=`${dayList.map(dLabel).join(' / ')} · ${DATA.meet.teams} ทีมเข้าแข่งขัน`;
const boys=ath.filter(a=>a.g==='M').length, girls=ath.length-boys;
$('#stats').innerHTML=[
 [ath.length,`นักกีฬา (ชาย ${boys} · หญิง ${girls})`],
 [ind.length,'รายการเดี่ยว'],
 [rel.length,'ทีมผลัด'],
 medStat()].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');
// filters
const ages=[...new Set(ath.map(a=>a.age))].sort((a,b)=>a-b);
const chips=(el,items,key,cls='')=>{$(el).innerHTML=items.map(([v,l,c])=>`<button class="chip ${c||cls}" data-k="${key}" data-val="${v}">${l}</button>`).join('')};
if(dayList.length>1)chips('#fd',[['','ทุกวัน'],...dayList.map(d=>[d,'Day '+d])],'d');else{$('#fd').classList.add('hidden');$('#fdsep').classList.add('hidden')}
chips('#fg',[['','ทุกเพศ'],['M','ชาย','m'],['F','หญิง','f'],['fav','★ ติดตาม']],'g');
chips('#fa',[['','ทุกอายุ'],...ages.map(a=>[a,a+' ปี'])],'a');
chips('#fs',[['','ทุกท่า'],...ST.map(s=>[s,s])],'s');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.val;
  if(k==='g'&&v==='fav'){S.fav=!S.fav}else if(k==='g'){S.g=S.g===v?'':v}else{S[k]=S[k]==v?'':v}render()});
$('#reset').onclick=()=>{Object.assign(S,{d:'',g:'',a:'',s:'',fav:false});S.sel.clear();render()};
const syncChips=()=>document.querySelectorAll('.chip').forEach(b=>{const k=b.dataset.k,v=b.dataset.val;
  b.classList.toggle('on',k==='g'&&v==='fav'?S.fav:String(S[k])===v)});
const okAth=a=>(!S.g||a.g===S.g)&&(!S.a||a.age==S.a)&&(!S.sel.size||S.sel.has(a.name))&&(!S.fav||favs.has(a.name));
const okDay=r=>!S.d||r.day==S.d;
const okRace=r=>!okDay(r)?false:r.relay?(!S.g||r.g===S.g)&&!S.a&&!S.sel.size&&!S.fav&&(!S.s):okAth(A[r.name])&&(!S.s||r.e.stroke===S.s);
// clock / now (Asia/Bangkok)
function bkk(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return{d:`${o.year}-${o.month}-${o.day}`,m:(+o.hour%24)*60+ +o.minute,t:`${o.hour%24}:${o.minute}`}}
const D1=(DAYS[1]||{date:'2026-11-07'}).date;
function nowM(){const b=bkk();const diff=Math.round((Date.parse(b.d)-Date.parse(D1))/864e5);return diff<0?-1:diff*1440+b.m}
const LASTM=Math.max(...R.map(r=>r.m));
// helpers
const seedTag=r=>r.seed==='NT'?`<span class="seedtag">NT</span>`:`<span class="seedtag ${r.rank&&r.rank<=3?'top':''}">${r.seed}${r.rank?` · #${r.rank}/${r.e.seeded}`:''}</span>`;
function resBadge(r){const x=r.res;if(!x)return '';
  if(!x.pl){return `<div class="res dq"><div class="pl">${esc(x.f||'DQ')}</div><div class="ft" style="color:var(--mut)">ไม่ได้อันดับ</div></div>`}
  const d=x.d!=null?`<div class="dl ${x.d<0?'up':'dn'}">${x.d<0?'▲ เร็วขึ้น '+(-x.d).toFixed(2):'▼ '+x.d.toFixed(2)}</div>`:(r.seed==='NT'?'<div class="dl" style="color:var(--mut)">เวลาแรก</div>':'');
  return `<div class="res">${x.nr?'<div><span class="nrb">🔥 NR</span></div>':''}${x.lv!=null?`<div class="medal" style="font-size:24px">${MED[x.lv]}</div>`:''}<div class="pl p${x.pl}" style="font-size:${x.lv!=null?'14px':'20px'}">ที่ ${x.pl}<small style="font-size:11px;color:var(--mut)">/${x.nfin}</small></div><div class="ft">${esc(x.f)}</div>${d}${x.pts?`<div class="dl" style="color:#3546b5">+${x.pts} คะแนน</div>`:''}</div>`}
// a race is done if it has a result, if a later event of the same day already has results (meet runs ahead of program),
// or if its program time is well past
const lastResEv=DATA.lastres||{};
const isDone=(r,nm)=>!!r.res||r.ev<(lastResEv[r.day]||0)||r.m<nm-5;
function raceCard(r,nm){const e=r.e,cls=isDone(r,nm)&&!r.res?'past':(!isDone(r,nm)&&nm>=r.m-5&&nm<=r.m+5?'now':'');
  const who=r.relay?`ศรีอรุโณทัย ทีม ${r.relay} <span class="tag rel">ผลัด</span>`:`${esc(r.name)}${r.gap!=null&&r.gap<TIGHT?` <span class="tag warn">ห่างรายการก่อน ${r.gap} นาที</span>`:''}`;
  return `<button class="race ${cls}" data-h="${r.ev}-${r.heat}"><div class="tm">${r.t}<small>Event ${r.ev}</small>${r.res||RESEV.has(r.ev)?`<div style="margin-top:4px">${pdfBtn(r.ev)}</div>`:''}</div>
  <div><div class="who"><span class="gdot ${r.g}"></span>${who}</div>
  <div class="what">${evLabel(e)} · ${G[e.g]} ${ageLabel(e)} · ฮีต ${r.heat}/${e.heats}${r.res?' ลู่ '+r.lane:''} ${seedTag(r)}</div>
  ${r.res&&r.res.why?`<div class="why">${esc(r.res.why)}</div>`:''}</div>
  ${r.res?resBadge(r):`<div class="lane"><b>${r.lane}</b><span>ลู่</span></div>`}</button>`}
// views
function vSchedule(){const nm=nowM();const all=R.filter(okRace);
  const past=all.filter(r=>isDone(r,nm)),list=S.showPast?all:all.filter(r=>!isDone(r,nm));
  $('#count').textContent=`เหลือ ${all.length-past.length} จาก ${all.length} รายการ`;
  let h=past.length?`<button class="pastbtn" id="pastbtn">${S.showPast?'▲ ซ่อนรายการที่แข่งไปแล้ว':'▼ แสดงรายการที่แข่งไปแล้ว'} <span>${past.length}</span></button>`:'';
  if(!list.length)return h+(all.length?'<div class="empty">แข่งครบทุกรายการตามตัวกรองแล้ว 🎉</div>':'<div class="empty">ไม่พบรายการตามตัวกรอง</div>');
  let cur='',cd=0;list.forEach(r=>{if(r.day!==cd){cd=r.day;cur='';if(dayList.length>1)h+=`<div class="dayhd">${dLabel(r.day)} <span>${list.filter(x=>x.day===r.day).length} รายการ</span></div>`}const hr=r.t.slice(0,2);if(hr!==cur){cur=hr;h+=`<div class="hour">${hr}:00 น.</div>`}h+=raceCard(r,nm)});return h}
function vAthletes(){const list=ath.filter(okAth).map(a=>({a,rs:a.races.filter(r=>(!S.s||r.e.stroke===S.s)&&okDay(r))})).filter(x=>x.rs.length);
  $('#count').textContent=`${list.length} คน · กด ☆ เพื่อติดตาม`;
  if(!list.length)return'<div class="empty">ไม่พบนักกีฬาตามตัวกรอง</div>';
  return `<div class="grid">${list.map(({a,rs})=>{const strokes=rs.map(r=>`<span class="sk">${dayList.length>1?'D'+r.day+' ':''}${r.e.dist} ${r.e.stroke}${r.res&&r.res.lv!=null?' '+MED[r.res.lv]:''}</span>`).join('');
   return `<div class="ath" role="button" tabindex="0" data-a="${esc(a.name)}"><button class="star ${favs.has(a.name)?'on':''}" data-star="${esc(a.name)}" aria-label="ติดตาม">${favs.has(a.name)?'★':'☆'}</button>
   <div class="top"><div class="av ${a.g}">${a.age}</div><div><div class="nm">${esc(a.name)}</div><div class="meta">${G[a.g]} · ${a.age} ปี · ${rs.length} รายการ${a.med.some(x=>x)?' · '+a.med.map((n,i)=>n?MED[i]+n:'').join(' '):''}</div></div></div>
   <div class="strk">${strokes}</div>
   <div class="span"><span>${dayList.length>1&&!S.d?dayList.map(d=>`D${d}: ${a.races.filter(r=>r.day===d).length}`).join(' · '):`แรก ${rs[0].t} · สุดท้าย ${rs.at(-1).t}`}</span>${a.minGap<TIGHT?`<span class="tag warn">ช่วงติด ${a.minGap} น.</span>`:''}</div></div>`}).join('')}</div>`}
function vAges(){const list=ath.filter(okAth);
  $('#count').textContent=`${list.length} คน แยกตามรุ่นอายุ`;
  const by={};list.forEach(a=>(by[a.age]??=[]).push(a));
  const keys=Object.keys(by).sort((a,b)=>a-b);
  if(!keys.length)return'<div class="empty">ไม่พบนักกีฬาตามตัวกรอง</div>';
  const SK=['ฟรีสไตล์','กรรเชียง','กบ','ผีเสื้อ','เดี่ยวผสม'],AB=['ฟรี','กร','กบ','ผี','IM'];
  return `<div class="legend">ช่องสี = ลงแข่งท่านั้น, ×2 = ลง 2 ระยะ (ฟรี=ฟรีสไตล์ · กร=กรรเชียง · กบ · ผี=ผีเสื้อ · IM=เดี่ยวผสม)</div><div class="agegrid">${keys.map(k=>{const xs=by[k];
   const rows=g=>{const ys=xs.filter(a=>a.g===g);if(!ys.length)return'';return `<div class="sexrow"><div class="lbl ${g}">${G[g]} · ${ys.length} คน</div>${ys.map(a=>{const st={};a.races.forEach(r=>st[r.e.stroke]=(st[r.e.stroke]||0)+1);
     return `<button class="ln" data-a="${esc(a.name)}"><span>${esc(a.name)}</span><span class="dots">${SK.map((s,i)=>`<i class="${st[s]?'y':''}">${AB[i]}${st[s]>1?'×'+st[s]:''}</i>`).join('')}</span></button>`}).join('')}</div>`};
   const n=xs.reduce((t,a)=>t+a.races.length,0);
   return `<div class="agebox"><h3>${k} ปี <small>${xs.length} คน · ${n} รายการ</small></h3>${rows('M')}${rows('F')}</div>`}).join('')}</div>`}
function lineup(k){return `<table class="lu">${H[k].map(x=>`<tr class="${x.me?'me':''}"><td>${x.l}</td><td><b>${esc(x.n)}</b>${x.tm?`<div class="tmn">${esc(x.tm)}${x.a?' · '+x.a+' ปี':''}</div>`:''}</td><td>${x.s}</td></tr>`).join('')}</table>`}
function vRelays(){const list=rel.filter(r=>(!S.g||r.g===S.g)&&okDay(r));
  $('#count').textContent=`${list.length} ทีมผลัด · ผลัด 4x25 ม.`+(S.a||S.sel.size||S.s||S.fav?' (ตัวกรองอายุ/นักกีฬา/ท่า ไม่ใช้กับผลัด)':'');
  if(!list.length)return'<div class="empty">ไม่พบทีมผลัด</div>';
  return list.map(r=>`<div class="relay"><div class="hd"><div><h3 class="disp" style="font-size:17px"><span class="gdot ${r.g}"></span> ${G[r.g]} ${r.e.age}</h3>
   <div class="what" style="font-size:13px;color:var(--mut)">Event ${r.ev} ${pdfA(r.ev)} · ${evLabel(r.e)} · ฮีต ${r.heat}/${r.e.heats} · ลู่ ${r.lane} · ${r.e.n} ทีมในรายการ</div>${r.res?`<div style="margin-top:4px;font-weight:700">${r.res.pl?(r.res.lv!=null?MED[r.res.lv]+' ':'')+'อันดับ '+r.res.pl:esc(r.res.f)} · ${esc(r.res.f)}</div>`:''}</div><span class="pill">D${r.day} · ${r.t} น.</span></div>${lineup(r.ev+'-'+r.heat)}</div>`).join('')}
// result PDF links
const RESEV=new Set(DATA.meet.resev||[]);
const pdfUrl=ev=>(DATA.meet.pdf_tpl||'').replace('{}',ev);
const PDFSVG='<svg viewBox="0 0 24 24" fill="none"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" fill="#e5484d"/><path d="M14 2v5h5" fill="#ffb3b5"/><text x="12" y="17.5" text-anchor="middle" font-size="6.2" font-weight="800" fill="#fff" font-family="Arial">PDF</text></svg>';
const pdfBtn=(ev,label)=>RESEV.has(ev)?`<span class="pdf" role="link" tabindex="0" data-pdf="${ev}" title="ใบผลการแข่งขัน Event ${ev}">${PDFSVG}${label||'ผล'}</span>`:'';
const pdfA=(ev,label)=>RESEV.has(ev)?`<a class="pdf" href="${pdfUrl(ev)}" target="_blank" rel="noopener">${PDFSVG}${label||'ผล'}</a>`:'';
// records
const yr=d=>d?String(d).slice(0,4):'';
function recLine(e){const x=e&&e.rec;if(!x)return '';
  return x.new?`<div class="rec new">🔥<span><b>สถิติใหม่ ${esc(x.t)}</b> · ${esc(x.n)} <small>${esc(x.tm||'')}${x.old?` · เดิม ${esc(x.old)}`:''}</small></span></div>`
             :`<div class="rec">🏁<span>สถิติภาคใต้ <b>${esc(x.t)}</b> · ${esc(x.n)} <small>${esc(x.tm||'')} ${yr(x.d)}</small></span></div>`}
function recGap(r){const x=r.e.rec,res=r.res;if(!x||!res||!res.pl)return '';const a=secs(res.f),b=secs(x.t);if(a==null||b==null)return '';const d=a-b;
  return d<=0?'':`<span style="font-size:12px;color:var(--mut)"> · ห่างสถิติ ${d.toFixed(2)} วิ</span>`}
function secs(t){const m=String(t||'').match(/^(?:(\d+):)?(\d+\.\d+)$/);return m?(+(m[1]||0))*60+ +m[2]:null}

const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let deferredPrompt=null;
const ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isAndroid=/Android/.test(ua);
const inApp=/FBAN|FBAV|Line\/|Instagram|Messenger/.test(ua);
function showInstall(){let done=false;try{done=localStorage.getItem('sri-installed')==='1'}catch(e){}if(isStandalone()||done)return;$('#install').classList.remove('hidden')}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstall()});
window.addEventListener('appinstalled',()=>{try{localStorage.setItem('sri-installed','1')}catch(e){}$('#install').classList.add('hidden')});
if(isIOS||isAndroid||matchMedia('(pointer:coarse)').matches)showInstall();
function howto(){let steps;
  if(inApp)steps=[`แตะเมนู <span class="kbd">⋯</span> มุมขวาบน แล้วเลือก <b>เปิดในเบราว์เซอร์</b> (Safari / Chrome)`,'กลับมาที่หน้านี้ แล้วกดปุ่ม "ติดตั้งแอปเชียร์" อีกครั้ง'];
  else if(isIOS)steps=[`แตะปุ่ม <b>แชร์</b> <span class="kbd">⬆︎</span> ที่แถบล่างของ Safari`,`เลื่อนลงแล้วเลือก <b>เพิ่มไปยังหน้าจอโฮม</b> (Add to Home Screen)`,'กด <b>เพิ่ม</b> มุมขวาบน — ไอคอน "ศรีอรุโณทัย" จะอยู่บนหน้าจอ'];
  else steps=[`แตะเมนู <span class="kbd">⋮</span> มุมขวาบนของ Chrome`,`เลือก <b>ติดตั้งแอป</b> หรือ <b>เพิ่มลงในหน้าจอหลัก</b>`,'กด <b>ติดตั้ง</b> — เปิดจากไอคอนบนหน้าจอได้เลย'];
  $('#sheet').innerHTML=`<button class="x" onclick="closeOv()">×</button><h2 style="display:flex;align-items:center;gap:10px"><img src="apple-touch-icon.png" alt="" style="width:44px;height:44px;border-radius:11px;box-shadow:0 1px 4px rgba(0,0,0,.2)"> ติดตั้งแอปเชียร์</h2><div style="color:var(--mut);font-size:14px">เปิดดูตาราง ผลแข่ง และเหรียญของน้องๆ ได้จากหน้าจอมือถือ</div><ol class="howto">${steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol>
  <button class="pk-b2" style="width:100%;margin-top:10px" id="instdone">ติดตั้งแล้ว ซ่อนปุ่มนี้</button>`;showOv()}
$('#install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice.catch(()=>({}));deferredPrompt=null;if(r&&r.outcome==='accepted'){try{localStorage.setItem('sri-installed','1')}catch(e){}$('#install').classList.add('hidden')}}else howto()};
document.addEventListener('click',e=>{if(e.target.closest('#instdone')){try{localStorage.setItem('sri-installed','1')}catch(err){}$('#install').classList.add('hidden');closeOv()}});
renderMedals();renderNext();setInterval(()=>{renderNext();if(S.v==='schedule')render()},60000);route();
$('#foot').innerHTML=`<span class="upd">อัปเดตผลล่าสุด ${DATA.meet.updated} น.</span> · ดึงผลอัตโนมัติทุก 10 นาทีจาก <a href="${DATA.meet.results_url}">cnxswimming.com</a><br>เวลาเป็นเวลาประมาณการตามโปรแกรม อาจเลื่อนตามหน้างาน · อันดับเวลาส่ง = อันดับ seed time ในรายการนั้น (NT = ไม่มีเวลาส่ง)`;
// auto reload when new data is deployed
// ---- pull to refresh
(function(){const ptr=$('#ptr'),ring=$('#ptrRing'),txt=$('#ptrTxt'),TH=80,MAX=130;let y0=null,dy=0,busy=false;
  const move=els=>v=>els.forEach(e=>e&&(e.style.transform=v?`translateY(${v}px)`:''));
  const shift=move([document.querySelector('.hero'),document.querySelector('.next'),$('#medals')]);
  function set(d){const p=Math.min(1,d/TH);ring.style.setProperty('--p',p.toFixed(3));ptr.style.transform=`translate(-50%,${Math.min(d,MAX)*0.85-96}px)`;shift(Math.min(d,MAX)*0.85);
    txt.textContent=d>=TH?'ปล่อยเพื่อรีโหลด':'ดึงลงเพื่อรีโหลด'}
  function reset(){ptr.classList.remove('drag','show','spin','ok');ptr.style.transform='';shift(0);document.body.classList.remove('pulling')}
  window.addEventListener('touchstart',e=>{if(busy||window.scrollY>0||$('#ov').classList.contains('show')||e.touches.length>1){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  window.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy<=0||window.scrollY>0){if(dy<0)y0=null;return}
    e.preventDefault();dy=dy*0.6;document.body.classList.add('pulling');ptr.classList.add('drag','show');set(dy);
    if(dy>=TH&&!ptr._buzz){ptr._buzz=1;try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}}else if(dy<TH)ptr._buzz=0},{passive:false});
  window.addEventListener('touchend',async()=>{if(y0==null)return;y0=null;document.body.classList.remove('pulling');ptr.classList.remove('drag');
    if(dy<TH){reset();return}
    busy=true;ptr.classList.add('spin');ptr.style.transform='translate(-50%,12px)';shift(100);txt.textContent='กำลังโหลดผลล่าสุด…';
    const t0=Date.now();let fresh=null;try{fresh=await (await fetch('data.json?t='+Date.now(),{cache:'no-store'})).json()}catch(_){}
    await new Promise(r=>setTimeout(r,Math.max(0,700-(Date.now()-t0))));
    if(fresh&&fresh.meet&&fresh.meet.ts>(DATA.meet.ts||'')){txt.textContent='มีผลใหม่ กำลังรีโหลด…';location.replace(location.pathname+'?v='+Date.now()+location.hash);return}
    ptr.classList.remove('spin');ptr.classList.add('ok');txt.textContent=fresh?'✓ ข้อมูลล่าสุดแล้ว':'ออฟไลน์ — ใช้ข้อมูลเดิม';renderFetched();renderNext();
    setTimeout(()=>{reset();busy=false},900)});
})();
let pendingNew=false;
async function checkNew(){try{const j=await (await fetch('data.json?t='+Date.now(),{cache:'no-store'})).json();
  if(j.meet&&j.meet.ts&&j.meet.ts>(DATA.meet.ts||'')){pendingNew=true;if(!$('#ov').classList.contains('show'))location.replace(location.pathname+'?v='+Date.now()+location.hash)}}catch(e){}}
checkNew();setInterval(checkNew,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){renderFetched();checkNew()}});
window.addEventListener('pageshow',e=>{if(e.persisted)checkNew()});
</script>
</body>
</html>
