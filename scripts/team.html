<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สรุปทีม · ศรีอรุโณทัย · ว่ายน้ำ อบจ.กระบี่ ชิงแชมป์ภาคใต้ #16</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b4f8a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--disp:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;--bg:#f3f7fa;--card:#fff;--ink:#0d2236;--mut:#5d7084;--line:#e1e8ef;--pri:#0b4f8a;--pri2:#0e7ac4;--aqua:#14b8c4;--r:16px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);margin:0}
a{color:var(--pri2)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{background:linear-gradient(135deg,#082d50,#0b4f8a 60%,#14b8c4);color:#fff;padding:14px 0 22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{color:#fff;text-decoration:none;font-weight:600;font-size:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 12px}
.pbtn{color:#fff;font:inherit;font-weight:600;font-size:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 12px;cursor:pointer}
.brand{display:flex;align-items:center;gap:12px;margin-top:14px}
.brand img{width:56px;height:56px;border-radius:50%;background:#fff}
.brand h1{font-size:23px;line-height:1.2}
.brand small{display:block;font-family:'IBM Plex Sans Thai',sans-serif;font-size:13px;opacity:.85;font-weight:500}
.status{margin-top:12px;font-size:13px;background:rgba(255,255,255,.14);border-radius:12px;padding:7px 12px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-12px;position:relative}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:0 4px 14px rgba(8,45,80,.06)}
.kpi b{display:block;font-family:var(--disp);font-size:26px;line-height:1.15}
.kpi span{font-size:12px;color:var(--mut)}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}}
h3.sec{font-size:17px;margin:22px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h3.sec small{font-family:'IBM Plex Sans Thai',sans-serif;font-weight:500;color:var(--mut);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm b{display:block;font-weight:600;line-height:1.3}
.row .nm small{color:var(--mut);font-size:12.5px}
.row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.row .v small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
.rk{font-family:var(--disp);font-weight:700;color:var(--mut);min-width:30px;text-align:center}
.tro{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tcard{background:linear-gradient(135deg,#fff8dd,#fff);border:1px solid #f3e1a0;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.tcard .big{font-family:var(--disp);font-size:30px;font-weight:700;color:#8a6300;line-height:1}
.tcard b{display:block}
.tcard small{color:var(--mut);font-size:12.5px;display:block}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.tag.ok{background:#e9f7ef;color:#0b6b3a}.tag.tmp{background:#fff3e8;color:#9a4a0b}
.me{background:#e8f7f9;border-radius:10px}
.up{color:#0f8a4b}.dq{color:#c0262d}
.md{display:flex;gap:7px;font-weight:700;font-size:13.5px;justify-content:flex-end}
.foot{font-size:12px;color:var(--mut);text-align:center;padding:24px 16px 40px}
.empty{color:var(--mut);padding:12px 0;font-size:14px}
@media print{.back,.pbtn{display:none}.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card,.tcard{break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="topbar"><a class="back" href="./">‹ หน้าหลัก</a><button class="pbtn" onclick="try{window.print()}catch(e){}">🖨️ พิมพ์</button></div>
  <div class="brand"><img src="logo.png" alt=""><h1>สรุปผลทีมศรีอรุโณทัย<small id="meet"></small></h1></div>
  <div class="status" id="status"></div>
</div></header>
<main class="wrap" id="main"></main>
<div class="foot" id="foot"></div>
<script src="photos.js"></script>
<script>
const DATA=__DATA__;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G={M:'ชาย',F:'หญิง'},MED=['🥇','🥈','🥉'];
const EV=DATA.events,R=DATA.races,ST=DATA.stand||{},CL=DATA.clubs,DAYS=DATA.days;
const nrm=s=>String(s).replace(/[\s.\u200b]/g,'');
const ageL=e=>/ปี/.test(e.age)?e.age:e.age+' ปี';
const evL=e=>`${e.dist}ม. ${e.stroke}`;
R.forEach(r=>{r.e=EV[r.ev]});
const A={};R.filter(r=>!r.relay).forEach(r=>{(A[r.name]??={name:r.name,age:r.age,g:r.e.g,races:[]}).races.push(r)});
const ath=Object.values(A);
ath.forEach(a=>{const e=a.races[0].e;a.cat=a.g+'|'+e.age;a.catL=`${G[a.g]} ${ageL(e)}`;a.st=(ST[a.cat]&&ST[a.cat].our[nrm(a.name)])||{p:0,rk:null};
  a.med=[0,0,0];a.races.forEach(r=>{if(r.res&&r.res.lv!=null)a.med[r.res.lv]++})});
const AV=(n,g,s)=>window.Photos?Photos.avatar(n,g,s):'';
function render(){
  const done=R.filter(r=>r.res),ind=done.filter(r=>!r.relay),rel=R.filter(r=>r.relay);
  const med=[0,0,0];done.forEach(r=>{if(r.res.lv!=null)med[r.res.lv]++});
  const pts=ind.reduce((t,r)=>t+(r.res.pts||0),0);
  const cmp=ind.filter(r=>r.res.d!=null),imp=cmp.filter(r=>r.res.d<0);
  const firsts=ind.filter(r=>r.seed==='NT'&&r.res.pl);
  const dqs=done.filter(r=>!r.res.pl);
  const ourNR=done.filter(r=>r.res.nr);
  const complete=done.length>=R.length;
  $('#meet').textContent=DATA.meet.name+' · '+Object.values(DAYS).map(d=>d.label).join(' / ');
  $('#status').innerHTML=complete?'✅ ผลครบทุกรายการแล้ว — สรุปผลทางการ':`⏳ สรุปชั่วคราว · ผลออก ${done.length}/${R.length} รายการ · อัปเดต ${DATA.meet.updated} น.`;
  let h=`<div class="kpis"><div class="kpi"><b>${ath.length}</b><span>นักกีฬา · ${R.filter(r=>!r.relay).length} รายการเดี่ยว · ${rel.length} ผลัด</span></div>
   <div class="kpi"><b>${MED[0]}${med[0]} ${MED[1]}${med[1]} ${MED[2]}${med[2]}</b><span>เหรียญรวม ${med[0]+med[1]+med[2]}</span></div>
   <div class="kpi"><b style="color:#3546b5">⭐ ${pts}</b><span>คะแนนรวม${CL&&CL.our?` · สโมสรอันดับ ${CL.our.rk}/${CL.n}`:''}</span></div>
   <div class="kpi"><b class="up">${cmp.length?Math.round(imp.length/cmp.length*100)+'%':'–'}</b><span>เร็วกว่าเวลาส่ง (${imp.length}/${cmp.length})</span></div></div>`;
  // trophies
  const tro=ath.filter(a=>a.st.rk&&a.st.rk<=6).sort((x,y)=>x.st.rk-y.st.rk);
  h+=`<h3 class="sec">🏆 ถ้วยนักกีฬายอดเยี่ยม <small>อันดับ 1–6 ของรุ่น จากคะแนนสะสม</small></h3>`;
  h+=tro.length?`<div class="tro">${tro.map(a=>{const sc=ST[a.cat];const fin=sc&&sc.done>=sc.nev;return `<div class="tcard">${AV(a.name,a.g,52)}<div style="flex:1;min-width:0"><b>${esc(a.name)}</b><small>รุ่น${a.catL} · ⭐ ${a.st.p} คะแนน</small><span class="tag ${fin?'ok':'tmp'}">${fin?'ยืนยันแล้ว':'ชั่วคราว · ผลออก '+sc.done+'/'+sc.nev}</span></div><div class="big">#${a.st.rk}</div></div>`}).join('')}</div>`:'<div class="card"><div class="empty">ยังไม่มีนักกีฬาในโซนถ้วย</div></div>';
  // club
  if(CL&&CL.top.length){h+=`<h3 class="sec">🏫 อันดับสโมสร <small>ถ้วย 3 อันดับแรก · ผลออก ${CL.done}/${CL.nev} รายการเดี่ยว</small></h3><div class="card">${CL.top.map(c=>`<div class="row ${c.me?'me':''}"><span class="rk">${c.rk<=3?'🏆'+c.rk:c.rk}</span><span class="nm"><b>${esc(c.n)}</b></span><span class="v">${c.p}<small>คะแนน</small></span></div>`).join('')}${CL.our&&!CL.top.some(c=>c.me)?`<div class="row me"><span class="rk">${CL.our.rk}</span><span class="nm"><b>${esc(CL.our.n)}</b></span><span class="v">${CL.our.p}<small>คะแนน</small></span></div>`:''}</div>`}
  // medal table
  const mt=ath.map(a=>({a,t:a.med[0]+a.med[1]+a.med[2]})).sort((x,y)=>y.a.med[0]-x.a.med[0]||y.a.med[1]-x.a.med[1]||y.a.med[2]-x.a.med[2]||y.a.st.p-x.a.st.p);
  h+=`<h3 class="sec">🏅 เหรียญและคะแนนรายคน <small>เรียงตามทอง เงิน ทองแดง</small></h3><div class="card">${mt.map((x,i)=>`<a class="row" style="color:inherit;text-decoration:none" href="summary.html?a=${encodeURIComponent(x.a.name)}"><span style="display:flex;align-items:center;gap:8px"><span class="rk">${i+1}</span>${AV(x.a.name,x.a.g,34)}</span><span class="nm"><b>${esc(x.a.name)}</b><small>${x.a.catL} · ${x.a.races.filter(r=>r.res).length}/${x.a.races.length} รายการ${x.a.st.rk?` · อันดับรุ่น #${x.a.st.rk}`:''}</small></span><span class="v"><span class="md">${x.a.med.map((n,j)=>`<span style="opacity:${n?1:.3}">${MED[j]}${n}</span>`).join('')}</span><small>⭐ ${x.a.st.p} คะแนน</small></span></a>`).join('')}</div>`;
  // improvements
  const top=imp.slice().sort((x,y)=>x.res.d-y.res.d).slice(0,12);
  if(top.length)h+=`<h3 class="sec">📈 พัฒนาการเด่น <small>เร็วกว่าเวลาส่งมากที่สุด</small></h3><div class="card">${top.map(r=>`<div class="row"><span>${AV(r.name,r.e.g,30)}</span><span class="nm"><b>${esc(r.name)}</b><small>${evL(r.e)} · ${esc(r.seed)} → ${esc(r.res.f)}</small></span><span class="v up">▲ ${(-r.res.d).toFixed(2)}<small>วินาที</small></span></div>`).join('')}</div>`;
  if(firsts.length)h+=`<h3 class="sec">🆕 ได้เวลาแรก <small>${firsts.length} รายการ · ใช้เป็นเวลาส่งครั้งต่อไป</small></h3><div class="card">${firsts.map(r=>`<div class="row"><span>${AV(r.name,r.e.g,30)}</span><span class="nm"><b>${esc(r.name)}</b><small>${evL(r.e)} · อันดับ ${r.res.pl}/${r.res.nfin}</small></span><span class="v">${esc(r.res.f)}</span></div>`).join('')}</div>`;
  // relays
  h+=`<h3 class="sec">🤝 ผลัด</h3><div class="card">${rel.map(r=>`<div class="row"><span class="rk">${r.res&&r.res.lv!=null?MED[r.res.lv]:'🏊'}</span><span class="nm"><b>${G[r.e.g]} ${ageL(r.e)} · ${r.e.stroke}</b><small>D${r.day||1} · Event ${r.ev}${r.res&&r.res.why?` · <span class="dq">${esc(r.res.whyth||r.res.why)}</span>`:''}${r.res&&r.res.sw&&r.res.sw.length?`<br>${r.res.sw.map((n,i)=>(i+1)+". "+esc(n.split(" ")[0])).join(" · ")}`:''}</small></span><span class="v">${r.res?(r.res.pl?`${esc(r.res.f)}<small>อันดับ ${r.res.pl}/${r.res.nfin}</small>`:`<span class="dq">${esc(r.res.f)}</span>`):'<small>รอผล</small>'}</span></div>`).join('')}</div>`;
  if(ourNR.length)h+=`<h3 class="sec">🔥 ทำลายสถิติภาคใต้</h3><div class="card">${ourNR.map(r=>`<div class="row"><span class="rk">🔥</span><span class="nm"><b>${esc(r.name||'ผลัดทีม '+r.relay)}</b><small>${evL(r.e)}</small></span><span class="v">${esc(r.res.f)}</span></div>`).join('')}</div>`;
  if(dqs.length)h+=`<h3 class="sec">⚠️ DQ / ไม่ได้อันดับ <small>สำหรับโค้ช</small></h3><div class="card">${dqs.map(r=>`<div class="row"><span class="rk dq">DQ</span><span class="nm"><b>${esc(r.name||'ผลัดทีม '+r.relay)}</b><small>${evL(r.e)}${r.res.why?' · '+esc(r.res.why):''}</small></span><span class="v"><small>Event ${r.ev}</small></span></div>`).join('')}</div>`;
  $('#main').innerHTML=h;
  $('#foot').innerHTML=`ข้อมูลจากใบผล <a href="${DATA.meet.results_url}">cnxswimming.com</a> · อัปเดต ${DATA.meet.updated} น. · เหรียญ: อายุ 7–11 ที่ 1–3 ของฮีต, 12–14 ที่ 1–3 ของรายการ, ผลัดที่ 1–3`;
}
render();if(window.Photos)Photos.onChange(render);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(async()=>{try{const j=await (await fetch('data.json?t='+Date.now(),{cache:'no-store'})).json();if(j.meet.ts>(DATA.meet.ts||''))location.replace(location.pathname+'?v='+Date.now())}catch(e){}},60000);
</script>
</body>
</html>
