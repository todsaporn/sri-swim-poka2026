<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สรุปรายคน · ศรีอรุโณทัย · Krabi PAO Swimming #16</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b4f8a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--disp:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;--bg:#f3f7fa;--card:#fff;--ink:#0d2236;--mut:#5d7084;--line:#e1e8ef;--pri:#0b4f8a;--pri2:#0e7ac4;--aqua:#14b8c4;--m:#1f6fd1;--f:#d6458a;--r:16px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--pri2)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.top{background:linear-gradient(135deg,#082d50,#0b4f8a 60%,#14b8c4);color:#fff;padding:14px 0 18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{color:#fff;text-decoration:none;font-weight:600;font-size:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 12px}
.upd{font-size:11.5px;opacity:.85}
.brand{display:flex;align-items:center;gap:10px;margin-top:12px}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff}
.brand h1{font-size:21px;line-height:1.2}
.brand small{display:block;font-family:'IBM Plex Sans Thai',sans-serif;font-size:12.5px;opacity:.85;font-weight:500}
.picker{position:sticky;top:0;z-index:10;background:rgba(243,247,250,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0}
.picker .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.picker .row::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}.dot.M{background:var(--m)}.dot.F{background:var(--f)}
.chip.on .dot{box-shadow:0 0 0 2px #fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.head{display:flex;gap:14px;align-items:center}
.av{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:22px;flex:0 0 auto}
.av.M{background:linear-gradient(135deg,#3a8ee6,#1f5fb8)}.av.F{background:linear-gradient(135deg,#ec6aa6,#b93374)}
.head h2{font-size:23px;line-height:1.2}
.head .meta{color:var(--mut);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kpi{background:#f6f9fb;border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-family:var(--disp);font-size:22px;line-height:1.15}
.kpi span{font-size:12px;color:var(--mut)}
.kpi.tro{background:#fff6d6}.kpi.tro b{color:#8a6300}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.hl div{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px}
.hl b{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:2px}
h3.sec{font-size:16px;margin:18px 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;color:var(--mut);font-weight:600;text-align:left;padding:6px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.pend td{color:#9aa9b7}
.ev b{display:block}
.ev small{color:var(--mut)}
.up{color:#0f8a4b;font-weight:600}.dn{color:#b4462b;font-weight:600}
.pdf{display:inline-flex;align-items:center;gap:3px;text-decoration:none;color:#c0262d;font-size:11px;font-weight:700;border:1px solid #f3c9cb;background:#fff5f5;border-radius:6px;padding:1px 5px 1px 3px}
.pdf svg{width:13px;height:13px}
.nrb{display:inline-block;background:#ff5a1f;color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 5px}
.dq{color:#c0262d;font-weight:700}
.why{font-size:11.5px;color:#c0262d}
/* mobile: table -> stacked rows */
@media(max-width:640px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:#fff}
  .tbl tbody{display:grid;gap:8px}.tbl tr{margin:0;display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
  .tbl td{border:0;padding:1px 0;display:flex;justify-content:space-between;gap:6px;font-size:13px}
  .tbl td.ev{grid-column:1/-1}
  .tbl tr.pend td:not(.ev){display:none}.tbl tr.pend td.ev:after{content:'รอผล';font-size:12px;color:#9aa9b7}
  .tbl td:before{content:attr(data-l);color:var(--mut);font-size:12px;font-weight:600;white-space:nowrap}
  .tbl td.ev{display:block;padding-bottom:4px;border-bottom:1px dashed var(--line);margin-bottom:4px}
  .tbl td.ev:before{content:none}
  .tbl td.n{text-align:right}
}
.cmp{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:#eef3f8;border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:linear-gradient(90deg,#14b8c4,#0e7ac4);border-radius:99px}
.stand td{padding:7px 6px}
.stand tr.me td{background:#e8f7f9;font-weight:700}
.tips{margin:0;padding:0;list-style:none}.tips li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.55}.tips li:last-child{border-bottom:0}
.slist{padding:6px 12px}
.srow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.srow .rk{font-family:var(--disp);font-weight:700;color:var(--mut);font-size:15px;white-space:nowrap}
.srow.tz .rk{color:#8a6300}
.srow .nm{min-width:0}.srow .nm b{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.srow .nm small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .pt{font-family:var(--disp);font-weight:700;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.srow .pt small{display:block;font-family:'IBM Plex Sans Thai',sans-serif;font-size:10.5px;color:var(--mut);font-weight:500}
.srow.me{background:#e8f7f9;border-radius:10px;border-bottom-color:transparent}.srow.me .nm b{color:var(--pri)}
.cut{text-align:center;font-size:11.5px;color:#b7860b;font-weight:600;padding:4px 0;border-bottom:1px dashed #f0d77a}
.gapnote{font-size:13px;color:var(--mut);margin-top:8px;padding:0 6px}
.olk{font-size:13px;border-radius:10px;padding:7px 10px;margin-top:8px;line-height:1.45}.olk.in{background:#fff6d6;color:#6b4d00}.olk.chance{background:#e9f7ef;color:#0b6b3a}.olk.out{background:#f3f5f7;color:#5d7084}
.empty{text-align:center;color:var(--mut);padding:30px}
.foot{font-size:12px;color:var(--mut);text-align:center;padding:24px 16px 40px}
.share{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}
@media print{.picker,.back,.share,.foot{display:none}.top{background:#0b4f8a;-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="topbar"><a class="back" href="./">‹ หน้าหลัก</a><span class="upd" id="upd"></span></div>
  <div class="brand"><img src="logo.png" alt=""><h1>สรุปผลรายคนแบบละเอียด<small id="meet"></small></h1></div>
</div></header>
<div class="picker"><div class="wrap"><div class="row" id="pick"></div></div></div>
<main class="wrap" id="main"></main>
<div class="foot" id="foot"></div>
<script src="photos.js"></script>
<script>
const DATA=__DATA__;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G={M:'ชาย',F:'หญิง'},MED=['🥇','🥈','🥉'];
const EV=DATA.events,R=DATA.races,ST=DATA.stand||{},DAYS=DATA.days,EVR=DATA.evres||{};
const nrm=s=>String(s).replace(/[\s.]/g,'');
const mins=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const secs=t=>{const m=String(t||'').match(/^(?:(\d+):)?(\d+\.\d+)$/);return m?(+(m[1]||0))*60+ +m[2]:null};
const fmtS=x=>{if(x==null)return '–';const m=Math.floor(x/60),s=(x-m*60).toFixed(2).padStart(5,'0');return m?`${m}:${s}`:(+s).toFixed(2)};
const ageL=e=>/ปี/.test(e.age)?e.age:e.age+' ปี';
const evL=e=>`${e.dist}ม. ${e.stroke}`;
const RESEV=new Set(DATA.meet.resev||[]);
const pdfUrl=ev=>(DATA.meet.pdf_tpl||'').replace('{}',ev);
const PDFSVG='<svg viewBox="0 0 24 24" fill="none"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" fill="#e5484d"/><path d="M14 2v5h5" fill="#ffb3b5"/><text x="12" y="17.5" text-anchor="middle" font-size="6.2" font-weight="800" fill="#fff" font-family="Arial">PDF</text></svg>';
const pdfA=ev=>RESEV.has(ev)?`<a class="pdf" href="${pdfUrl(ev)}" target="_blank" rel="noopener">${PDFSVG}ผล</a>`:'';
R.forEach(r=>{r.e=EV[r.ev];r.day=r.day||1;r.m=(r.day-1)*1440+mins(r.t)});
const A={};R.filter(r=>!r.relay).forEach(r=>{(A[r.name]??={name:r.name,age:r.age,g:r.e.g,races:[]}).races.push(r)});
const ath=Object.values(A).sort((a,b)=>a.g.localeCompare(b.g)||a.age-b.age||a.name.localeCompare(b.name,'th'));
ath.forEach(a=>{a.races.sort((x,y)=>x.m-y.m);const e=a.races[0].e;a.cat=a.g+'|'+e.age;a.catL=`${G[a.g]} ${ageL(e)}`;a.st=(ST[a.cat]&&ST[a.cat].our[nrm(a.name)])||{p:0,rk:null}});
$('#meet').textContent=DATA.meet.name;
$('#upd').textContent='อัปเดต '+DATA.meet.updated+' น.';
$('#foot').innerHTML=`ข้อมูลจากใบผล <a href="${DATA.meet.results_url}">cnxswimming.com</a> · เหรียญ: อายุ 7–11 ที่ 1–3 ของฮีต, 12–14 ที่ 1–3 ของรายการ · คะแนนจากอันดับรวมของรายการ สะสมชิงถ้วยนักกีฬายอดเยี่ยม 1–6 ของรุ่น`;
function outlook(a){const sc=(DATA.stand||{})[a.cat];if(!sc)return null;const left=a.races.filter(r=>!r.res&&!r.relay).length,max=left*15,p=a.st.p||0;
  const t=sc.top||[];const p6=t[5]?t[5].p:0,p7=t[6]?t[6].p:0;
  if(a.st.rk&&a.st.rk<=6)return {cls:'in',txt:`อยู่ในโซนถ้วย (อันดับ ${a.st.rk})${t[6]?` · นำอันดับ 7 อยู่ ${p-p7} คะแนน`:''}${left?` · เหลือ ${left} รายการ เก็บได้อีกสูงสุด ${max}`:' · แข่งครบแล้ว'}`};
  const need=Math.max(1,p6-p+1);
  if(!left)return {cls:'out',txt:`แข่งครบแล้ว · ห่างอันดับ 6 อยู่ ${p6-p} คะแนน`};
  if(need>max)return {cls:'out',txt:`เหลือ ${left} รายการ (สูงสุด ${max} คะแนน) ยังไม่พอแซงอันดับ 6 (${p6} คะแนน)`};
  const PT=[15,7,5,3,2,1];let ex;if(need<=15){let pl=1;PT.forEach((v,i)=>{if(v>=need)pl=i+1});ex=pl===1?'ได้ที่ 1 ของรายการ 1 ครั้ง':`ติดท็อป ${pl} ของรายการ 1 ครั้ง`}else ex=`ได้ที่ 1 อย่างน้อย ${Math.ceil(need/15)} รายการ`;
  return {cls:'chance',txt:`ยังลุ้นได้! ต้องเก็บอีก ≥${need} คะแนน จาก ${left} รายการ (เช่น ${ex}) · ถ้าคู่แข่งไม่ได้คะแนนเพิ่ม`}}
let cur=null;
function pick(){const q=new URLSearchParams(location.search).get('a')||decodeURIComponent(location.hash.slice(1)||'');return A[q]?q:ath[0].name}
function renderPick(){$('#pick').innerHTML=ath.map(a=>`<button class="chip ${a.name===cur?'on':''}" data-a="${esc(a.name)}">${Photos.avatar(a.name,a.g,22)}${esc(a.name.split(' ')[0])}<small style="opacity:.7">${a.age}</small></button>`).join('');
  const on=$('#pick .on');on&&on.scrollIntoView({inline:'center',block:'nearest'})}
function show(n){cur=n;history.replaceState(null,'','?a='+encodeURIComponent(n));renderPick();render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)show(b.dataset.a);
  if(e.target.closest('#share')){const u=location.href;(navigator.share?navigator.share({title:document.title,url:u}):navigator.clipboard.writeText(u).then(()=>{e.target.textContent='คัดลอกลิงก์แล้ว ✓'})).catch(()=>{})}});
function render(){const a=A[cur];const rs=a.races,done=rs.filter(r=>r.res);
  const med=[0,0,0];let pts=0,imp=0,cmp=0,sumd=0,dq=0,nr=0;
  done.forEach(r=>{const x=r.res;if(x.lv!=null)med[x.lv]++;pts+=x.pts||0;if(!x.pl)dq++;if(x.nr)nr++;if(x.d!=null){cmp++;sumd+=x.d;if(x.d<0)imp++}});
  const best=done.filter(r=>r.res.pl).sort((x,y)=>x.res.pl/x.res.nfin-y.res.pl/y.res.nfin)[0];
  const bigImp=done.filter(r=>r.res.d!=null).sort((x,y)=>x.res.d-y.res.d)[0];
  const sc=ST[a.cat];
  let h=`<div class="card"><div class="head">${Photos.avatar(a.name,a.g,64,{edit:true})}<div style="flex:1"><h2>${esc(a.name)}</h2><div class="meta">${a.catL} · ${rs.length} รายการ (D1 ${rs.filter(r=>r.day===1).length} · D2 ${rs.filter(r=>r.day===2).length}) · ผลออก ${done.length}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="share" id="card" style="background:#14b8c4;border-color:#14b8c4;color:#062033">🖼️ การ์ด</button><button class="share" id="share">🔗 ลิงก์</button></div></div>
  <div class="kpis"><div class="kpi"><b>${MED[0]}${med[0]} ${MED[1]}${med[1]} ${MED[2]}${med[2]}</b><span>เหรียญ</span></div>
   <div class="kpi"><b style="color:#3546b5">⭐ ${a.st.p||pts}</b><span>คะแนนสะสม</span></div>
   <div class="kpi ${a.st.rk&&a.st.rk<=6?'tro':''}"><b>${a.st.rk?(a.st.rk<=6?'🏆 ':'')+'#'+a.st.rk:'–'}</b><span>อันดับในรุ่น${sc?` (ผลออก ${sc.done}/${sc.nev})`:''}</span></div>
   <div class="kpi"><b class="${cmp&&imp/cmp>=.5?'up':''}">${cmp?imp+'/'+cmp:'–'}</b><span>เร็วกว่าเวลาส่ง</span></div></div>
  <div class="hl">${best?`<div><b>ผลดีที่สุด</b>${evL(best.e)} · อันดับ ${best.res.pl}/${best.res.nfin} · ${esc(best.res.f)}</div>`:''}
   ${bigImp&&bigImp.res.d<0?`<div><b>พัฒนาการมากที่สุด</b>${evL(bigImp.e)} · เร็วขึ้น ${(-bigImp.res.d).toFixed(2)} วิ (${esc(bigImp.seed)} → ${esc(bigImp.res.f)})</div>`:''}
   ${cmp?`<div><b>เฉลี่ยเทียบเวลาส่ง</b><span class="${sumd<0?'up':'dn'}">${sumd<0?'เร็วขึ้น':'ช้าลง'} ${Math.abs(sumd/cmp).toFixed(2)} วิ/รายการ</span></div>`:''}
   ${dq||nr?`<div><b>อื่นๆ</b>${nr?`<span class="nrb">NR</span> ทำลายสถิติ ${nr} รายการ `:''}${dq?`<span class="dq">DQ/ไม่ได้อันดับ ${dq}</span>`:''}</div>`:''}</div></div>`;
  // ---- development analysis
  const fin=done.filter(r=>r.res.pl&&secs(r.res.f)!=null);
  const gaps=fin.map(r=>{const x=EVR[r.ev]||{},f=secs(r.res.f),t3=x.top&&x.top[2]&&secs(x.top[2].f),c6=secs(x.c6),rec=r.e.rec&&secs(r.e.rec.t),win=x.top&&x.top[0]&&secs(x.top[0].f);
    return {r,f,podium:t3!=null&&r.res.pl>3?f-t3:null,pts:c6!=null&&r.res.pl>6?f-c6:null,rec:rec!=null?f-rec:null,win:win!=null&&r.res.pl>1?f-win:null,pct:1-(r.res.pl-1)/Math.max(1,r.res.nfin-1)}});
  const sk={};gaps.forEach(g=>{(sk[g.r.e.stroke]??=[]).push(g)});
  const skA=Object.entries(sk).map(([k,v])=>({k,n:v.length,p:v.reduce((t,g)=>t+g.pct,0)/v.length,d:v.filter(g=>g.r.res.d!=null)})).sort((a,b)=>b.p-a.p);
  const tips=[];
  if(skA.length){const s0=skA[0];tips.push(`💪 <b>จุดแข็ง: ${s0.k}</b> — อันดับเฉลี่ยท็อป ${Math.max(1,Math.round((1-s0.p)*100))}% ของรุ่น`);
    if(skA.length>1){const s1=skA[skA.length-1];if(s1.p<s0.p-.1)tips.push(`🎯 <b>ควรพัฒนา: ${s1.k}</b> — อันดับเฉลี่ยท็อป ${Math.max(1,Math.round((1-s1.p)*100))}% (ต่างจากท่าที่ดีที่สุด ${Math.round((s0.p-s1.p)*100)} จุด)`)}}
  const nearPod=gaps.filter(g=>g.podium!=null&&g.podium>0).sort((a,b)=>a.podium-b.podium)[0];
  if(nearPod)tips.push(`🥉 <b>ใกล้โพเดียมที่สุด:</b> ${evL(nearPod.r.e)} — ต้องเร็วขึ้นอีก <b>${nearPod.podium.toFixed(2)} วิ</b> จะติดอันดับ 3 ของรายการ`);
  const nearPts=gaps.filter(g=>g.pts!=null&&g.pts>0).sort((a,b)=>a.pts-b.pts)[0];
  if(nearPts)tips.push(`⭐ <b>ใกล้โซนคะแนนที่สุด:</b> ${evL(nearPts.r.e)} — ห่างอันดับ 6 อยู่ <b>${nearPts.pts.toFixed(2)} วิ</b> (เข้าท็อป 6 ได้คะแนนสะสมชิงถ้วย)`);
  const slow=done.filter(r=>r.res.d!=null&&r.res.d>0.3).sort((x,y)=>y.res.d-x.res.d);
  if(slow.length)tips.push(`⏱️ <b>ช้ากว่าเวลาส่ง ${slow.length} รายการ</b> — มากสุด ${evL(slow[0].e)} (+${slow[0].res.d.toFixed(2)} วิ) ควรดูเรื่องการออกตัว/กลับตัว หรือความเหนื่อยสะสม`);
  const tight=[];for(let i=1;i<rs.length;i++){const g=rs[i].m-rs[i-1].m;if(rs[i].day===rs[i-1].day&&g<15&&rs[i].res&&rs[i].res.d!=null)tight.push({r:rs[i],g})}
  tight.forEach(t=>tips.push(`🔁 ${evL(t.r.e)} พักแค่ ${t.g} นาทีจากรายการก่อน — ผล${t.r.res.d<0?'ยังเร็วขึ้น ดีมาก':'ช้าลง '+t.r.res.d.toFixed(2)+' วิ อาจเป็นผลจากเวลาพัก'}`));
  const dqs=done.filter(r=>!r.res.pl);dqs.forEach(r=>tips.push(`⚠️ <b>${evL(r.e)}: ${esc(r.res.f)}</b>${r.res.why?' — '+esc(r.res.why):''} → ฝึกจุดนี้กับโค้ชเพื่อไม่ให้เสียรายการ`));
  if(cmp&&imp/cmp>=.6)tips.push(`📈 พัฒนาการดีมาก — เร็วกว่าเวลาส่ง ${imp} จาก ${cmp} รายการ`);
  const nts=done.filter(r=>r.seed==='NT'&&r.res.pl);if(nts.length)tips.push(`🆕 ได้เวลาแรก ${nts.length} รายการ (${nts.map(r=>evL(r.e)+' '+r.res.f).join(', ')}) — ใช้เป็นเวลาส่งรายการครั้งต่อไป`);
  if(tips.length)h+=`<h3 class="sec">🧭 วิเคราะห์เพื่อการพัฒนา</h3><div class="card"><ul class="tips">${tips.map(t=>`<li>${t}</li>`).join('')}</ul><div style="font-size:11.5px;color:var(--mut);margin-top:8px">วิเคราะห์อัตโนมัติจากผลที่ออกแล้ว ใช้ประกอบการคุยกับโค้ช ไม่ใช่คำแนะนำการฝึกโดยตรง</div></div>`;
  if(fin.length){h+=`<h3 class="sec">📏 ระยะห่างเป้าหมาย (วินาที)</h3><div class="card" style="padding:8px 12px"><table class="tbl"><thead><tr><th>รายการ</th><th>เวลา</th><th>ถึงที่ 1</th><th>ถึงโพเดียม (ที่ 3)</th><th>ถึงโซนคะแนน (ที่ 6)</th><th>ถึงสถิติ</th></tr></thead><tbody>${gaps.map(g=>{const c=v=>v==null?'<span style="color:#0f8a4b;font-weight:700">✓</span>':v.toFixed(2);
    return `<tr><td class="ev"><b>${evL(g.r.e)}</b><small>D${g.r.day} · อันดับ ${g.r.res.pl}/${g.r.res.nfin}</small></td><td data-l="เวลา" class="n"><b>${esc(g.r.res.f)}</b></td><td data-l="ถึงที่ 1" class="n">${c(g.win)}</td><td data-l="ถึงโพเดียม" class="n">${c(g.podium)}</td><td data-l="ถึงโซนคะแนน" class="n">${c(g.pts)}</td><td data-l="ถึงสถิติ" class="n">${g.rec==null?'–':g.rec<=0?'<span class="nrb">NR</span>':g.rec.toFixed(2)}</td></tr>`}).join('')}</tbody></table><div style="font-size:11.5px;color:var(--mut);margin-top:6px">✓ = ทำได้แล้ว · คิดจากผลรวมทุกฮีตของรายการ</div></div>`}
  // by stroke
  const bys={};done.filter(r=>r.res.pl).forEach(r=>{(bys[r.e.stroke]??=[]).push(r)});
  if(Object.keys(bys).length){h+=`<h3 class="sec">อันดับเฉลี่ยแยกท่า <small style="font-weight:500;color:var(--mut);font-size:12px">(ยิ่งเต็มยิ่งอยู่หัวตาราง)</small></h3><div class="card"><div class="cmp">${Object.entries(bys).map(([k,v])=>{const p=v.reduce((t,r)=>t+(1-(r.res.pl-1)/Math.max(1,r.res.nfin-1)),0)/v.length;return `<div class="bar"><span>${k} <small style="color:var(--mut)">(${v.length})</small></span><span class="tr"><i style="width:${Math.round(p*100)}%"></i></span><span style="text-align:right;font-weight:600">ท็อป ${Math.max(1,Math.round((1-p)*100))}%</span></div>`}).join('')}</div></div>`}
  // category standings
  if(sc&&sc.top.length){const top=sc.top.slice(0,8);const mine=top.some(t=>nrm(t.n)===nrm(a.name));
   const row=(rk,n,tm,p,me)=>`<div class="srow ${me?'me':''} ${rk&&rk<=6?'tz':''}"><span class="rk">${rk&&rk<=6?'🏆':''}${rk||'–'}</span><span class="nm"><b>${esc(n)}</b><small>${esc(tm)}</small></span><span class="pt">${p}<small>คะแนน</small></span></div>`;
   h+=`<h3 class="sec">🏆 ลุ้นถ้วยรุ่น${a.catL} <small style="font-weight:500;color:var(--mut);font-size:12px">ถ้วยอันดับ 1–6</small></h3><div class="card slist">${top.map((t,i)=>(i===6?'<div class="cut">— เส้นโซนถ้วย —</div>':'')+row(t.rk,t.n,t.tm,t.p,nrm(t.n)===nrm(a.name))).join('')}${mine?'':'<div class="cut">⋯</div>'+row(a.st.rk,a.name,'ศรีอรุโณทัย',a.st.p,true)}
   ${(o=>o?`<div class="olk ${o.cls}" style="margin:8px 6px 4px">🏆 ${o.txt}</div>`:'')(outlook(a))}
   ${top[5]&&(!a.st.rk||a.st.rk>6)?`<div class="gapnote">ห่างโซนถ้วย (อันดับ 6) อยู่ <b>${top[5].p-a.st.p}</b> คะแนน${a.st.p?'':' — คะแนนได้จากการติดท็อป 6 ของรายการ (ผลรวมทุกฮีต)'}</div>`:''}</div>`}
  // races table
  h+=`<h3 class="sec">📋 ทุกรายการ</h3><div class="card" style="padding:8px 12px"><table class="tbl"><thead><tr><th>รายการ</th><th>ฮีต/ลู่</th><th>เวลาส่ง</th><th>เวลาที่ทำ</th><th>เทียบเวลาส่ง</th><th>อันดับรวม</th><th>ในฮีต</th><th>เหรียญ</th><th>คะแนน</th><th>ห่างสถิติ</th></tr></thead><tbody>`;
  rs.forEach(r=>{const x=r.res,e=r.e,rec=e.rec;const f=x&&secs(x.f),rs_=rec&&secs(rec.t);
   h+=`<tr class="${x?'':'pend'}"><td class="ev"><b>${evL(e)} ${pdfA(r.ev)}</b><small>D${r.day} · ${r.t} น. · Event ${r.ev}${rec?` · 🏁 สถิติ ${esc(rec.t)}`:''}</small>${x&&x.why?`<div class="why">${esc(x.why)}</div>`:''}</td>
   <td data-l="ฮีต/ลู่" class="n">${r.heat}/${e.heats} · ${r.lane}</td>
   <td data-l="เวลาส่ง" class="n">${esc(r.seed)}${r.rank?` <small style="color:var(--mut)">#${r.rank}</small>`:''}</td>
   <td data-l="เวลาที่ทำ" class="n">${x?(x.pl?`<b>${esc(x.f)}</b>`:`<span class="dq">${esc(x.f)}</span>`)+(x.nr?' <span class="nrb">NR</span>':''):'รอผล'}</td>
   <td data-l="เทียบเวลาส่ง" class="n">${x&&x.d!=null?`<span class="${x.d<0?'up':'dn'}">${x.d<0?'▲ '+(-x.d).toFixed(2):'▼ '+x.d.toFixed(2)}</span>`:(x&&r.seed==='NT'&&x.pl?'เวลาแรก':'–')}</td>
   <td data-l="อันดับรวม" class="n">${x&&x.pl?`${x.pl}/${x.nfin}`:'–'}</td>
   <td data-l="ในฮีต" class="n">${x&&x.hpl?x.hpl:'–'}</td>
   <td data-l="เหรียญ" class="n">${x&&x.lv!=null?MED[x.lv]:'–'}</td>
   <td data-l="คะแนน" class="n">${x&&x.pts?'+'+x.pts:'–'}</td>
   <td data-l="ห่างสถิติ" class="n">${f!=null&&rs_!=null&&x.pl?(f-rs_<=0?'<span class="nrb">NR</span>':(f-rs_).toFixed(2)+' วิ'):'–'}</td></tr>`});
  h+=`</tbody></table></div>`;
  $('#main').innerHTML=h}
function cardInfo(a){const done=a.races.filter(r=>r.res&&r.res.pl);const med=[0,0,0];a.races.forEach(r=>{if(r.res&&r.res.lv!=null)med[r.res.lv]++});
  const best=done.slice().sort((x,y)=>(x.res.lv??9)-(y.res.lv??9)||x.res.pl/x.res.nfin-y.res.pl/y.res.nfin);
  return {name:a.name,g:a.g,cat:`${a.catL} · ${a.races.length} รายการ`,catShort:a.catL.replace(/^ชาย |^หญิง /,''),meet:DATA.meet.name,date:Object.values(DAYS).map(d=>d.label).join(' / '),med,pts:a.st.p,rk:a.st.rk,logo:'logo.png',
    results:best.slice(0,5).map(r=>({ev:`${r.e.dist}ม. ${r.e.stroke}`,time:r.res.f,place:`ที่ ${r.res.pl}/${r.res.nfin}`,medal:r.res.lv!=null?MED[r.res.lv]:''}))}}
document.addEventListener('click',e=>{if(e.target.closest('#card'))Photos.shareCard(cardInfo(A[cur]))});
Photos.onChange(()=>{renderPick();render()});
cur=pick();renderPick();render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(async()=>{try{const j=await (await fetch('data.json?t='+Date.now(),{cache:'no-store'})).json();if(j.meet.ts>(DATA.meet.ts||''))location.replace(location.pathname+'?a='+encodeURIComponent(cur)+'&v='+Date.now())}catch(e){}},60000);
</script>
